version: '3.8'

services:
  inventory-app:
    build: .
    container_name: inventory-ga-app
    restart: always
    env_file:
      - .env
    expose:
      - "3000" # Tidak dipublish ke host — cuma nginx yang boleh diakses dari luar

  nginx:
    image: nginx:alpine
    container_name: inventory-ga-nginx
    restart: always
    ports:
      - "8088:80" # Akses aplikasi di port 8088
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - inventory-app
