server {
    listen 80;

    # Reverse proxy semua request ke server Express (backend Node),
    # yang sudah menangani serve file statis (dist/) DAN endpoint /api/*.
    location / {
        proxy_pass http://inventory-app:3000;
        proxy_http_version 1.1;

        # Header standar reverse proxy — inventory-app sudah trust proxy
        # (app.set('trust proxy', 1) di api/index.ts) supaya rate limiting
        # & deteksi IP asli berjalan benar di belakang nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan WebSocket upgrade (jaga-jaga untuk kebutuhan realtime di masa depan)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
